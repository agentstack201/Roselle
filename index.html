<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9C1C41">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roselle">
<meta name="application-name" content="Roselle">
<meta name="description" content="Roselle — متجر الزهور السعودية الفاخرة. ورد الطائف، الفل السعودي، والأزهار المحلية.">
<meta name="format-detection" content="telephone=no">

<title>Roselle — متجر الزهور</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-startup-image" href="/images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash">
  <img src="/images/logo.png" alt="Roselle">
  <div class="splash-bar"><i></i></div>
</div>

<!-- ===== SHELL ===== -->
<div id="app">

  <div class="update-bar" id="updateBar">
    <span>يتوفّر إصدار جديد من التطبيق</span>
    <button id="updateBtn">تحديث</button>
  </div>
  <div class="offline-bar" id="offlineBar"></div>

  <!-- APP BAR -->
  <header class="app-bar">
    <button class="bar-btn" id="barRight" aria-label="بحث"></button>
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div class="brand-name">Roselle</div>
      <div class="brand-sub">Flower Shop</div>
    </div>
    <button class="bar-btn" id="barCart" aria-label="السلة">
      <span class="dot-badge" id="barBadge">0</span>
    </button>
  </header>

  <main class="scroll" id="scroll">

    <!-- ========== HOME ========== -->
    <section class="screen on" id="s-home">
      <div class="banner" id="installBanner">
        <span class="ic" id="installIc"></span>
        <div class="t"><b>ثبّت تطبيق Roselle</b><span>وصول أسرع من شاشتك الرئيسية</span></div>
        <button class="go" id="installBtn">تثبيت</button>
        <button class="x" id="installX"></button>
      </div>

      <div class="hero" id="hero"></div>

      <div class="stats" id="homeStats"></div>

      <div class="row-head">
        <h3>الأكثر طلباً</h3>
        <button data-go="store">عرض الكل <span class="ic" id="goIc"></span></button>
      </div>
      <div class="grid" id="homeGrid"></div>
      <div style="height:18px"></div>
    </section>

    <!-- ========== STORE ========== -->
    <section class="screen" id="s-store">
      <h1 class="page-title">المتجر</h1>
      <div class="chips" id="chips"></div>
      <div class="grid" id="storeGrid"></div>
      <div style="height:18px"></div>
    </section>

    <!-- ========== PRODUCT DETAIL ========== -->
    <section class="screen" id="s-product">
      <div class="detail-media" id="pMedia"></div>
      <div class="dots" id="pDots"></div>
      <div class="detail-body">
        <h1 class="detail-name" id="pName"></h1>
        <div class="detail-price" id="pPrice"></div>
        <p class="detail-desc" id="pDesc"></p>
        <div class="qty-row">
          <label>الكمية</label>
          <div class="stepper">
            <button id="pMinus" aria-label="إنقاص"></button>
            <b id="pQty">1</b>
            <button id="pPlus" aria-label="زيادة"></button>
          </div>
        </div>
        <div style="height:22px"></div>
        <button class="btn btn-primary" id="pAdd">إضافة للسلة</button>
      </div>
    </section>

    <!-- ========== CART ========== -->
    <section class="screen" id="s-cart">
      <h1 class="page-title">السلة</h1>
      <div id="cartWrap"></div>
    </section>

    <!-- ========== CHECKOUT ========== -->
    <section class="screen" id="s-checkout">
      <h1 class="page-title">إتمام الطلب</h1>
      <div class="form">
        <div class="form-head"><span class="ic" id="coIc"></span> بيانات التوصيل</div>
        <div class="field">
          <label>الاسم الكامل *</label>
          <input id="fName" type="text" placeholder="اكتب اسمك الكامل" autocomplete="name">
        </div>
        <div class="field">
          <label>رقم الجوال *</label>
          <input id="fPhone" type="tel" inputmode="tel" placeholder="05xxxxxxxx" autocomplete="tel">
        </div>
        <div class="field">
          <label>عنوان التوصيل *</label>
          <input id="fAddr" type="text" placeholder="المدينة، الحي، الشارع" autocomplete="street-address">
        </div>
        <div class="field">
          <label>ملاحظات (اختياري)</label>
          <textarea id="fNotes" placeholder="وقت التوصيل المفضّل، بطاقة إهداء…"></textarea>
        </div>
        <div class="summary" style="margin:4px 0 18px">
          <div class="sum-row"><span>الإجمالي الفرعي</span><b id="coSub">0</b></div>
          <div class="sum-row"><span>رسوم التوصيل</span><b id="coShip">0</b></div>
          <div class="sum-row total"><span>المجموع</span><b id="coTotal">0</b></div>
        </div>
        <button class="btn btn-primary" id="placeBtn">تأكيد الطلب</button>
      </div>
    </section>

    <!-- ========== ORDERS ========== -->
    <section class="screen" id="s-orders">
      <h1 class="page-title">طلباتي</h1>
      <div id="ordersWrap"></div>
    </section>

    <!-- ========== ACCOUNT ========== -->
    <section class="screen" id="s-account">
      <div class="acct-head">
        <div class="acct-ring" id="acctIc"></div>
        <h2 id="acctName">زائر</h2>
        <p id="acctSub">سجّل أول طلب لتظهر بياناتك هنا</p>
      </div>
      <div class="menu" id="acctMenu"></div>
      <div style="height:18px"></div>
    </section>

    <!-- ========== ADMIN ========== -->
    <section class="screen" id="s-admin">
      <h1 class="page-title">إدارة المنتجات</h1>
      <div class="form" style="padding-bottom:8px">
        <button class="btn btn-primary btn-sm" id="addProdBtn">إضافة منتج جديد</button>
      </div>
      <div class="orders" id="adminList"></div>
      <div style="height:18px"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>
</div>

<!-- ===== SHEETS ===== -->
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheetOrder">
  <div class="grip"></div>
  <div class="sheet-head"><h3>تفاصيل الطلب</h3><button class="bar-btn" data-close="sheetOrder"></button></div>
  <div id="sheetOrderBody" style="padding:0 20px"></div>
</div>

<div class="sheet" id="sheetProduct">
  <div class="grip"></div>
  <div class="sheet-head"><h3 id="pfTitle">إضافة منتج</h3><button class="bar-btn" data-close="sheetProduct"></button></div>
  <div class="form" style="padding-top:0">
    <input type="hidden" id="pfId">
    <div class="field"><label>اسم المنتج (عربي) *</label><input id="pfNameAr" placeholder="باقة ورد الطائف"></div>
    <div class="field"><label>الاسم بالإنجليزية</label><input id="pfNameEn" dir="ltr" placeholder="Taif Rose Bouquet"></div>
    <div class="field"><label>السعر (ر.س) *</label><input id="pfPrice" type="number" inputmode="decimal" dir="ltr" min="0" step="1" placeholder="299"></div>
    <div class="field"><label>الكمية في المخزون</label><input id="pfStock" type="number" inputmode="numeric" dir="ltr" min="0" placeholder="20"></div>
    <div class="field"><label>التصنيف</label>
      <select id="pfCat">
        <option>ورد الطائف</option><option>الفل السعودي</option>
        <option>الأزهار المحلية</option><option>تنسيقات</option><option>هدايا</option>
      </select>
    </div>
    <div class="field"><label>الوصف</label><textarea id="pfDesc" placeholder="وصف قصير للمنتج…"></textarea></div>
    <div class="field"><label>رابط الصورة</label><input id="pfImg" dir="ltr" placeholder="/images/taif-rose.jpg"></div>
    <button class="btn btn-primary" id="pfSave">حفظ المنتج</button>
  </div>
</div>

<div class="sheet" id="sheetConfirm">
  <div class="grip"></div>
  <div class="sheet-head"><h3 id="cfTitle">تأكيد</h3><button class="bar-btn" data-close="sheetConfirm"></button></div>
  <div class="form" style="padding-top:0">
    <p id="cfMsg" style="font-size:14.5px;color:var(--muted);line-height:1.8;padding:0 4px 20px"></p>
    <button class="btn btn-danger" id="cfYes">نعم، متأكد</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost" data-close="sheetConfirm">إلغاء</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/icons.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
