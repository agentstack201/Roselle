<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-box">

  <h2>تسجيل الدخول</h2>
  <p class="login-note">دفتر جهات الاتصال — مشروع مقرر CT1552</p>

  <div class="msg" id="msg"></div>

  <form id="form">

    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="loginBtn">دخول</button>

  </form>

</div>

<script src="db.js"></script>
<script>
const msg = document.getElementById('msg');

document.getElementById('form').onsubmit = async function (e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (username === '' || password === '') {
    msg.textContent = 'الرجاء إدخال اسم المستخدم وكلمة المرور';
    msg.className = 'msg show';
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;

  const user = await checkLogin(username, password);

  if (user) {
    sessionStorage.setItem('username', user.username);
    location.href = 'contacts.html';
  } else {
    msg.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    msg.className = 'msg show';
    btn.disabled = false;
  }
};
</script>

</body>
</html>
