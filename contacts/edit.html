<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعديل جهة اتصال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <span>المستخدم: <b id="who"></b></span>
  <a href="#" onclick="logout()">تسجيل الخروج</a>
</div>

<h1>دفتر جهات الاتصال</h1>
<p class="note">مشروع مقرر CT1552</p>

<div class="menu">
  <a href="contacts.html">عرض جهات الاتصال</a>
  <a href="add.html">إضافة جهة اتصال</a>
</div>

<div class="msg" id="msg"></div>

<form id="form">

  <label for="name">الاسم</label>
  <input type="text" id="name" required>

  <label for="phone">رقم الجوال</label>
  <input type="text" id="phone" required>

  <button type="submit">حفظ التعديل</button>

</form>

<script src="db.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const msg = document.getElementById('msg');

if (requireLogin()) {
  document.getElementById('who').textContent = sessionStorage.getItem('username');
  load();
}

async function load() {
  const c = await getOne(id);

  if (!c) {
    msg.textContent = 'جهة الاتصال غير موجودة';
    msg.className = 'msg show';
    return;
  }

  document.getElementById('name').value = c.name;
  document.getElementById('phone').value = c.phone;
}

document.getElementById('form').onsubmit = async function (e) {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (name === '' || phone === '') {
    msg.textContent = 'الرجاء تعبئة جميع الحقول';
    msg.className = 'msg show';
    return;
  }

  await updateContact(id, name, phone);

  msg.textContent = 'تم التعديل بنجاح';
  msg.className = 'msg show';
};
</script>

</body>
</html>
