<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9C1C41">
<title>Roselle — غير متصل</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Noto Sans Arabic',system-ui,sans-serif;
    background:#FDF4F6;color:#2C1A20;direction:rtl;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:28px;text-align:center
  }
  .ring{
    width:104px;height:104px;border-radius:50%;background:#FBE7EC;
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:#C9456B
  }
  svg{width:46px;height:46px}
  h1{font-size:21px;color:#9C1C41;margin-bottom:10px}
  p{font-size:14.5px;color:#9A858C;line-height:1.85;margin-bottom:30px}
  button{
    font-family:inherit;background:#9C1C41;color:#fff;border:none;
    padding:16px 40px;border-radius:999px;font-size:15.5px;font-weight:700;
    cursor:pointer;box-shadow:0 6px 20px rgba(156,28,65,.3)
  }
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<div>
  <div class="ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 8.8a16 16 0 0 1 20 0M5.5 12.4a11 11 0 0 1 13 0M9 16a6 6 0 0 1 6 0"/>
      <circle cx="12" cy="19.6" r="1.1" fill="currentColor"/>
      <path d="M3 3l18 18" stroke-width="1.8"/>
    </svg>
  </div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقّق من اتصالك ثم أعد المحاولة.<br>يمكنك تصفّح الصفحات المحفوظة،<br>أما إرسال الطلبات فيحتاج اتصالاً.</p>
  <button onclick="location.href='/'">إعادة المحاولة</button>
</div>
</body>
</html>
