<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roselle - غير متصل</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #fff8f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .icon { font-size: 80px; margin-bottom: 24px; }
  h1 { color: #722F37; font-size: 24px; margin-bottom: 12px; }
  p { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
  button {
    background: #722F37;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<div>
  <div class="icon">🌸</div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>يبدو أن اتصالك بالإنترنت منقطع.<br>تحقق من اتصالك وحاول مرة أخرى.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
